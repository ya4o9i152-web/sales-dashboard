name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチで新しく push されたら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: テスト（集計の正解値・CSVの検証・AI分析のSnapshot）
        run: npm test
      - name: スキーマと権限の検証
        run: npm run verify:schema
      - name: ビルド
        run: npm run build
        env:
          # ビルドは接続しないので、形だけの値でよい（本物のキーは Vercel の環境変数にだけ置く）
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: build-only-placeholder

  # main に入ったコードを、テストに合格した場合だけ本番へ出す。
  # Vercel の「main へのマージで自動デプロイ」は vercel.json で止めてあり、本番に出る道はこのジョブだけ。
  # （Pull Request ごとのプレビューは Vercel の GitHub 連携のまま）
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 公式の Vercel CLI を使う（第三者のアクションにトークンを渡さない）
      - run: npm install --global vercel@64.3.1
      - name: Vercel の本番用の設定と環境変数を取得
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: ビルド
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: 本番へデプロイ
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
